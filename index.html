
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Para ti 🌻</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Pantalla inicial -->
    <div class="intro" id="intro">

        <div class="intro-content">

            <div class="intro-heart">♡</div>

            <p class="intro-small">
                Tengo algo para ti...
            </p>

            <button id="openButton">
                Abrir <span>💛</span>
            </button>

        </div>

    </div>


    <!-- Escena principal -->
    <main class="scene" id="scene">

        <!-- Destellos y decoración -->
        <div class="romantic-decor">

            <span class="sparkle sparkle-1">✦</span>
            <span class="sparkle sparkle-2">✧</span>
            <span class="sparkle sparkle-3">✦</span>
            <span class="sparkle sparkle-4">✧</span>
            <span class="sparkle sparkle-5">✦</span>

            <span class="heart">♡</span>

        </div>


        <!-- Pétalos -->
        <div class="petals" id="petals"></div>


        <!-- Flores -->
        <div class="flowers" id="flowers"></div>


        <!-- Mensaje -->
        <section class="message">

            <span class="small-text">
                Para ti 🌻
            </span>

            <h1>
                Gracias por hacer<br>
                mis días especiales
            </h1>

            <div class="line"></div>

            <p>
                Por cada sonrisa, cada momento<br>
                y cada pequeño detalle juntos,<br>
		eres todo lo que quiero en mi vida siempre.<br>
		Te amo con todo mi corazón mi reina ❤️
            </p>


        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
